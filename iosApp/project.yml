# Xcode project for the iOS app, generated on a Mac (Codemagic) with: xcodegen generate
name: Streamo
options:
  bundleIdPrefix: com.streamo
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.2.3"
    CURRENT_PROJECT_VERSION: "7"
targets:
  Streamo:
    type: application
    platform: iOS
    sources: [iosApp]
    scheme: {}
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Streamo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamo.app
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, Shared]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The shared Kotlin code is built for Apple Silicon simulators only (iosSimulatorArm64)
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    preBuildScripts:
      - name: Build shared Kotlin code
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
